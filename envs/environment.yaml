name: mpnst-scrnaseq
channels:
  - bioconda
  - conda-forge
dependencies:
  - r-base>=4.3
  - r-seurat>=5.0
  - r-seuratobject>=5.0
  - r-ggplot2
  - r-patchwork
  - r-future
  - r-dplyr
  - r-data.table
  - r-reshape2
  - r-mclust
  - r-cluster
  - bioconductor-batchelor
  - r-seuratwrappers  # SeuratWrappers (FastMNNIntegration) -- may need remotes::install_github() if unavailable via conda
  - r-bpcells         # BPCells, for the export helper scripts under Sketch_parallel/
  - pip
